<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up · BrandSentinel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238ba7ff'/%3E%3Cpath d='M16 7l7 2.6v5.8c0 4.2-3 7.2-7 8.4-4-1.2-7-4.2-7-8.4V9.6z' fill='%2309090b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/auth.css">
</head>

<body class="auth-compact">
  <main class="card">
    <div class="brand"><i></i>BrandSentinel</div>
    <h1>Create your <em>account.</em></h1>
    <p class="sub" id="org">Takes about a minute.</p>

    <form id="form" novalidate>
      <div class="seg-role" role="radiogroup" aria-label="Join as">
        <button type="button" class="seg-opt active" id="optEmployee" role="radio" aria-checked="true">Employee</button>
        <button type="button" class="seg-opt" id="optManager" role="radio" aria-checked="false">Manager</button>
      </div>
      <p class="role-hint" id="roleHint">Upload content, see the problems found and respond to them.</p>

      <div class="two">
        <div><label for="name">Full name</label><input id="name" autocomplete="name" required maxlength="80" placeholder="Jane Doe"></div>
        <div><label for="email">Work email</label><input id="email" type="email" autocomplete="email" required maxlength="120" placeholder="name@company.com"></div>
      </div>
      <label for="password">Password</label>
      <div class="pw"><input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"><button type="button" id="toggle">Show</button></div>
      <ul id="pwRules"></ul>
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" required>
      <button class="btn" id="go" type="submit">Create employee account</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
    <div class="alt">Already have an account? <a href="/login.html">Sign in</a> · <a href="/demo">Try the demo</a></div>
  </main>
  <script src="/auth-validate.js"></script>
  <script src="/signup.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/motion.js" defer></script>
<script src="/bg.js"></script>
<script src="/login-hero.js"></script>
</body>
</html>
