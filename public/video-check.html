<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video check · BrandSentinel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238ba7ff'/%3E%3Cpath d='M16 7l7 2.6v5.8c0 4.2-3 7.2-7 8.4-4-1.2-7-4.2-7-8.4V9.6z' fill='%2309090b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/auth.css">
<link rel="stylesheet" href="/video-check.css">
</head>
<body class="vc">
<main class="card wide">
  <div class="brand"><i></i>BrandSentinel <span class="pill">Video Intelligence</span></div>
  <h1>Run a reel <em>past the sentinel.</em></h1>
  <p class="sub">Speech, on-screen text and visuals are reviewed against your brand kit: scored, timestamped, fact-checked against approved sources. AI suggests, you decide.</p>
  <form id="form">
    <label for="video">Video (MP4, MOV or WEBM, up to 60 MB)</label>
    <input id="video" type="file" accept="video/mp4,video/quicktime,video/webm" required>
    <div id="pre" class="pre-grid" hidden></div>
    <div class="row">
      <div><label for="type">Content type</label>
        <select id="type"><option value="reel">Reel</option><option value="social_post">Social post</option><option value="ad">Ad</option><option value="other">Other</option></select></div>
      <div><label for="audience">Intended audience</label><input id="audience" maxlength="200" placeholder="e.g. first-year students"></div>
    </div>
    <button class="btn" id="go" type="submit">Analyse video</button>
    <button class="btn ghostbtn" id="sample" type="button">Preview a sample report</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div id="stages" class="stages" hidden></div>
  <section id="out" hidden></section>
  <div class="alt"><a href="/">Back to the app</a></div>
</main>
<script src="/video-check.js"></script>
<script src="/vendor/gsap.min.js"></script>
<script src="/motion.js" defer></script>
<script src="/bg.js"></script>
</body>
</html>
